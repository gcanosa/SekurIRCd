# SekurIRCd spam filters -- example/template. Loaded when [spam] enabled = true
# AND [spam] filters_enabled = true; edit freely, then /REHASH. Operators can
# also manage rules live with /SPAMFILTER LIST | ADD | DEL (ADD appends here,
# DEL removes the matching line; comments in this file are left alone).
#
# One rule per line:
#
#   <targets> <action> <duration|-> "<reason>" <regex to end of line>
#
# targets   letters, combine freely:
#             p  PRIVMSG to a user        c  PRIVMSG to a channel
#             n  NOTICE to a user         N  NOTICE to a channel
#             a  AWAY message             q  QUIT reason
#             P  PART reason              t  TOPIC text
# action    block  drop the message and tell the sender (quit/part reasons are
#                  silently replaced with a blank one)
#           warn   let it through, but notify opers (+s) -- good for testing a
#                  new rule before enforcing it
#           kill   disconnect the sender
#           zline  disconnect and Z-line their IP (all connections from it)
# duration  Z-line length for `zline` (30m, 1h, 1d, ...); "-" = use
#           [spam] zline_duration. Ignored by the other actions.
# reason    shown to the sender / opers; double quotes required
# regex     POSIX extended regex, case-insensitive, matched anywhere in the
#           text after mIRC colour/bold codes are stripped. Backreferences
#           (\1) and patterns that match the empty string are rejected.
#
# Rules are checked top to bottom; the first match wins, so put the most
# severe rules first. Opers, services, and (by default) identified accounts
# are never filtered -- see [spam] in sekurircd.toml.
#
# The rules below are illustrative starting points -- review them against
# your own network's traffic before turning enforcement on. Start with `warn`
# and watch the oper notices.

# Channel-advertisement patterns. Swap `block` for `zline 1h` once you trust it.
pcnN block - "channel advertisement" (join|visit|come to) +#[a-z0-9_-]+ .*(free|cheap|porn|casino|bitcoin|crypto)

# Pasted "check out my site" links from a fresh connection to many people.
pn block - "unsolicited link" (https?://|www\.)[a-z0-9.-]+\.(xyz|top|click|club|icu|ru)/?

# Classic mass-message boilerplate.
pcnN block - "spam" (buy|cheap|discount) +(viagra|cialis|rolex|followers|likes)

# Warn only: these are common but sometimes legitimate; watch the notices.
pc warn - "possible invite spam" (server|join) .*(discord\.gg|t\.me)

# Spam hidden in quit / part reasons and topics.
qPt block - "advertising in reason" (https?://|www\.)[^ ]+.*(free|cheap|casino|porn)

# Advertising another IRC network: "irc.quakenet.org", "irc . quakenet . org",
# "chat.host.com", "irc(dot)example(dot)net". Spaces and (dot)/[dot]/"dot"
# around the separators are allowed so the spaced-out evasion is caught too.
# Only unidentified users are affected, but a legitimate "irc.libera.chat" in
# a help question would match -- change `block` to `warn` if that bites.
pcnN block - "network advertisement" (irc|ircs|chat)[[:space:]]*(\.|\(dot\)|\[dot\]|[[:space:]]dot[[:space:]])[[:space:]]*[a-z0-9-]+[[:space:]]*(\.|\(dot\)|\[dot\]|[[:space:]]dot[[:space:]])[[:space:]]*(org|net|com|info|chat|xyz|top|club|icu|ru)

# "/server host", or host + port (e.g. "irc.example.net:6667", "port 6697").
pcnN block - "network advertisement" (/server[[:space:]]+[a-z0-9.-]+|[a-z0-9-]+\.[a-z]{2,}[[:space:]]*(:|port[[:space:]]+)\+?66[0-9][0-9])
