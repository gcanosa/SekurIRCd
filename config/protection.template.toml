# =============================================================================
#  SekurIRCd -- Protection bundle (config/protection.toml)
# =============================================================================
#  Optional abuse protection in one file: connection caps, the connect-flood
#  throttle, the flood guard, spam protection, DNSBL lookups and an open-proxy
#  scanner. Found through [security] protection_file in sekurircd.toml; a
#  setting here wins over the same one there.
#
#  Setup:  1. cp config/protection.template.toml config/protection.toml
#          2. edit it (scanner on? then set [scanner.target] ip)
#          3. /REHASH, then /PROTECT shows what is active
#
#  How to read this file:
#    [required]  must be set when its section is turned on
#    [optional]  leave it out and the value shown applies (the default)
#    "#key =" lines are off / at their default: remove the "#" to set them.
#  Durations are like "30s", "10m", "1h", "1d". Results are logged under
#  "protection" and shown in [debug_channel].
#
#  Contents: [exempt] [connection] [flood] [spam] [blacklist] [[blacklist.zone]]
#            [scanner] [scanner.target]
# =============================================================================

# =============================================================================
#  [exempt] -- addresses never DNSBL-checked or scanned
# =============================================================================
# e.g. a bouncer or VPN exit that runs a proxy on purpose. Caps and the
# connect-flood throttle still apply: for those an oper uses /ELINE <ip|CIDR>.
[exempt]
# [optional] IP globs ("*", "?").
ips = [
    "127.*",
    # "10.*", "192.168.*",
]

# =============================================================================
#  [connection] -- connection caps and the connect-flood throttle
# =============================================================================
[connection]
# [optional] Total simultaneous connections. 0 = unlimited.
max_connections = 0
# [optional] Simultaneous connections from one IP. 0 = unlimited.
max_connections_per_ip = 0
# [optional] More than connect_flood_max connects from one IP within
# connect_flood_window seconds = a Z-line for connect_flood_ban_duration
# ("" = permanent). 0 = throttle off. Scanner probes never count.
connect_flood_max = 5
connect_flood_window = 10.0
connect_flood_ban_duration = "10m"

# =============================================================================
#  [flood] -- per-client message flood guard
# =============================================================================
[flood]
# [optional] More than max_msgs lines within `window` seconds = disconnected.
max_msgs = 20
window = 1.0
# [optional] Per-command rate limits: "<COMMAND> <most>/<seconds>"; past it
# the user gets "try again" (263) and the command is not run. Stops WHO/LIST
# scraping, WHOIS probing, nick flipping. Opers are never limited; NICK counts
# once registered. (Same key as sekurircd.toml [security].)
#command_limits = ["WHO 5/10", "LIST 2/30", "WHOIS 10/10", "NICK 3/60"]

# =============================================================================
#  [spam] -- private messages, notices and channels
# =============================================================================
# Three layers: 1) new connections can't PM users for new_user_period;
# 2) regex filters from filters_file (live with /SPAMFILTER); 3) limits on
# message targets and repeated text. Opers with +s see every action. Start
# with "warn" and tighten. Filter rules marked `global` reach every linked
# server and are enforced there even where enabled = false.
[spam]
# [optional] Turn layers 1 and 3 (and this server's own filters) on.
enabled = false
# [optional] Who is skipped: opers, and anyone logged in to an account.
exempt_opers = true
exempt_identified = true
# [optional] Connections older than this skip layer 3 (not the filters). "0" = never.
trust_age = "0"

# --- layer 1: new-connection PM lock ---
# [optional] How long a new connection can't PM users ("0" = off). Services
# and opers stay reachable.
new_user_period = "30s"

# --- layer 2: content filters ---
# [optional] This server's own rules: on/off, and their file ("" = memory
# only). Global rules from other servers apply anyway, checked first.
filters_enabled = true
filters_file = "spamfilters.conf"

# --- layer 3: target and repeat limits ---
# [optional] Most different targets per target_window (<= 31), and most
# repeats of one text (<= 32, texts of 8+ characters). 0 = that check off.
max_targets = 5
target_window = "30s"
max_repeat = 4
# [optional] What a limit does: "block" (drop), "warn" (tell opers), "kill",
# or "zline" (kill + Z-line for zline_duration; "0" = permanent).
limit_action = "block"
zline_duration = "1h"

# =============================================================================
#  [blacklist] -- DNSBL: ban addresses others already reported
# =============================================================================
# Each connecting IP is looked up in every [[blacklist.zone]]; the client waits
# at most `timeout` seconds. Replaces the old [dnsbl] of sekurircd.toml.
[blacklist]
# [optional] Turn the lookups on.
enabled = true
# [optional] Seconds before an address counts as not listed.
timeout = 5.0
# [optional] "zline" (ban the IP), "kline" (user@host ban) or "reject"
# (refuse this connection only).
action = "zline"
# [optional] Ban length ("" = permanent; IPs get reassigned, so rarely right).
ban_duration = "1d"

# =============================================================================
#  [[blacklist.zone]] -- one block per list; the first match in file order wins
# =============================================================================
#   name         [required] zone hostname
#   type         [optional] "reply" (the answer's last octet is a code below)
#                or "bitmask" (a code matches if its bit is set)
#   replies      [optional] ["<code>:<text>", ...]; [] = any listing bans
#   ban_unknown  [optional] also ban codes not in replies (default true)
#   reason       [optional] shown to the user: %i = IP, %t = zone, %r = reply text
# Check a zone is alive and read its terms: a dead zone just times out.
# EFnet RBL: IRC-focused (proxies, drones, spam hosts), free, no query limits.
[[blacklist.zone]]
name = "rbl.efnetrbl.org"
type = "reply"
ban_unknown = true
reason = "Blacklisted (%r) -- for more information, visit https://rbl.efnetrbl.org/?i=%i"
replies = [
    "1:open proxy",
    "2:spamtrap666",
    "3:spamtrap50",
    "4:TOR",
    "5:drones / flooding",
]

# Another zone (email-focused; free for low-volume, non-commercial use):
# [[blacklist.zone]]
# name = "zen.spamhaus.org"
# type = "reply"
# ban_unknown = false
# replies = ["4:exploited host", "5:exploited host", "6:exploited host", "7:exploited host"]
# reason = "Listed in %t (%r)"

# =============================================================================
#  [scanner] -- active open-proxy scanner
# =============================================================================
# On connect the server dials the client's IP on common proxy ports and asks
# each to relay back here; its own banner coming back = an open proxy, banned.
# Runs in the background (nobody waits). Before turning it on: it makes
# outbound connections (some providers call that port scanning), and
# [scanner.target] ip must be the PUBLIC address. Try action = "reject" first.
[scanner]
# [optional] Turn the scanner on.
enabled = false
# [optional] "zline", "kline" or "reject" (disconnect only), and the ban length.
action = "zline"
ban_duration = "1d"
# [optional] Shown to the user: %i = IP, %t = protocol that worked, %p = port.
reason = "Open %t proxy found on your host (port %p) -- secure it and reconnect"
# [optional] Probes, "type:port"; types http (CONNECT), httppost, socks4,
# socks5. One socket per entry per client: keep it short.
protocols = [
    "http:80",
    "http:8080",
    "http:3128",
    "http:6588",
    "httppost:80",
    "httppost:8080",
    "socks4:1080",
    "socks5:1080",
]
# [optional] Seconds before a probe is abandoned, and bytes read without a match.
timeout = 10.0
max_read = 4096
# [optional] Most probe sockets at once (past it new clients aren't scanned).
max_concurrent = 256
# [optional] Source address for probes ("" = system default).
bind = ""
# [optional] Don't rescan a clean address for this long ("0" = every connect).
negcache = "0"
# [optional] Log every probe result at DEBUG (log file only).
log_all_scans = false

# =============================================================================
#  [scanner.target] -- where the probes relay to: this server
# =============================================================================
[scanner.target]
# [required when the scanner is on] THIS server's public IPv4 address.
ip = ""
# [optional] A plain (non-TLS) client port of this server.
port = 6667
# [optional] Text that proves a relay worked. Leave unset unless you know why.
#strings = [
#    "*** Looking up your hostname",
#    "ERROR :Closing Link",
#    "ERROR :Too many connections",
#]
