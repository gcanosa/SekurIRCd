# =============================================================================
#  SekurIRCd -- Protection bundle
# =============================================================================
#
#  Optional abuse protection in one file: connection limits, flood and spam
#  protection, DNSBL blacklists and an open-proxy scanner.
#
#  Setup:
#    1. cp config/protection.template.toml config/protection.toml
#       (found through [security] protection_file in sekurircd.toml)
#    2. edit it -- if you turn the scanner on, set [scanner.target] ip
#    3. /REHASH, then /PROTECT to see what is active
#
#  Anything set here wins over the same setting in sekurircd.toml. Bans, scan
#  results and problems are logged under "protection" and shown in your
#  [debug_channel].
#
#  Sections:
#    [exempt]      addresses never checked
#    [connection]  connection caps and the connect-flood throttle
#    [flood]       per-client message flood guard
#    [spam]        spam protection
#    [blacklist]   DNSBL lookups: bans addresses others already reported
#    [scanner]     open-proxy scanner: finds bad addresses itself
# =============================================================================


# -----------------------------------------------------------------------------
#  EXEMPT -- never DNSBL-checked or scanned
# -----------------------------------------------------------------------------
# IP globs ("*", "?"). Useful for a trusted host that runs a proxy on purpose
# (a bouncer, your VPN exit). Connection caps and the flood throttle still apply.
[exempt]

ips = [
    "127.*",
    # "10.*", "192.168.*",
]


# -----------------------------------------------------------------------------
#  CONNECTION -- caps and connect-flood throttle
# -----------------------------------------------------------------------------
[connection]

# Total simultaneous connections. 0 = unlimited.
max_connections = 0

# Simultaneous connections from one IP. 0 = unlimited.
max_connections_per_ip = 0

# More than connect_flood_max connections from one IP within
# connect_flood_window seconds = automatic Z-line for
# connect_flood_ban_duration ("10m", "1h", "1d"; "" = permanent).
# 0 turns it off. The proxy scanner's own probes never count.
connect_flood_max = 5
connect_flood_window = 10.0
connect_flood_ban_duration = "10m"


# -----------------------------------------------------------------------------
#  FLOOD -- per-client message flood guard
# -----------------------------------------------------------------------------
# More than max_msgs lines within `window` seconds = disconnected.
[flood]

max_msgs = 20
window = 1.0


# -----------------------------------------------------------------------------
#  SPAM -- private messages, notices and channels
# -----------------------------------------------------------------------------
# Three layers, all off until enabled = true:
#   1. new connections can't PM users for new_user_period (services and
#      opers stay reachable)
#   2. regex content filters from filters_file, managed live with /SPAMFILTER
#      (format: config/spamfilters.template.conf)
#   3. limits on how many targets one client messages, and on repeated text
# Opers with +s see every action, message included. Start with "warn" as the
# limit_action and in filter rules, then tighten. Each server applies its own
# copy to its own users.
[spam]

enabled = false

# --- who is skipped ---

exempt_opers = true

# Anyone logged in to an account (the cheapest way to let regulars through).
exempt_identified = true

# Connections older than this skip layer 3 (not the filters). "0" = never.
trust_age = "0"

# --- layer 1: new-connection PM lock ---

# "0" = off. Durations: "30s", "10m", "1h", "1d".
new_user_period = "30s"

# --- layer 3: target and repeat limits ---

# 0 turns a check off. max_targets <= 31, max_repeat <= 32; repeats count
# only for texts of 8+ characters.
max_targets = 5
target_window = "30s"
max_repeat = 4

# "block" (drop the message), "warn" (tell opers only), "kill", or "zline"
# (kill + Z-line for zline_duration; "0" = permanent).
limit_action = "block"
zline_duration = "1h"

# --- layer 2: content filters ---

# Relative to this file. "" = no file: /SPAMFILTER rules live in memory only.
filters_enabled = true
filters_file = "spamfilters.conf"


# -----------------------------------------------------------------------------
#  BLACKLIST -- DNSBL lookups
# -----------------------------------------------------------------------------
# Every connecting IP is looked up in each zone below. A listing that matches
# the zone's rules bans it before it can do anything. The client's input waits
# for the lookups (at most `timeout` seconds). Replaces the old [dnsbl]
# section of sekurircd.toml.
[blacklist]

enabled = true

# Seconds to wait before treating an address as not listed.
timeout = 5.0

# "zline" (ban the IP, checked first on later connects), "kline" (also
# matches user@host masks) or "reject" (refuse this connection only).
action = "zline"

# "1d", "12h", "30m" or seconds; "" = permanent. IPs get reassigned, so
# permanent bans from a listing are rarely right.
ban_duration = "1d"

# --- zones ---
# One [[blacklist.zone]] per list; the first match (in file order) decides.
#   name         zone hostname (required)
#   type         "reply": the answer's last octet must equal a code below
#                "bitmask": a code matches if its bit is set
#   replies      ["<code>:<text>", ...]; empty = any listing bans
#   ban_unknown  ban on a code not in replies too (default true); false =
#                ban only the categories you list
#   reason       shown to the user: %i = IP, %t = zone, %r = reply text

# EFnet RBL: IRC-focused (open proxies, drones, spam hosts), free, no query limits.
[[blacklist.zone]]
name = "rbl.efnetrbl.org"
type = "reply"
ban_unknown = true
reason = "Blacklisted (%r) -- for more information, visit https://rbl.efnetrbl.org/?i=%i"
replies = [
    "1:open proxy",
    "2:spamtrap666",
    "3:spamtrap50",
    "4:TOR",
    "5:drones / flooding",
]

# Another zone, as an example. Check a zone is alive and read its terms first:
# a dead zone just times out and protects nothing. (DroneBL closed its public
# DNSBL in 2021.)
#
# [[blacklist.zone]]
# name = "zen.spamhaus.org"       # email-focused; free for low-volume, non-commercial use
# type = "reply"
# ban_unknown = false
# replies = ["4:exploited host", "5:exploited host", "6:exploited host", "7:exploited host"]
# reason = "Listed in %t (%r)"


# -----------------------------------------------------------------------------
#  SCANNER -- active open-proxy scanner
# -----------------------------------------------------------------------------
# When a client connects, the server connects back to its IP on common proxy
# ports and asks each to relay to this server. If this server's own banner
# comes back, the address is an open proxy and gets banned. Scans run in the
# background: clients are never kept waiting.
#
# Before turning it on:
#   * it makes outbound connections to arbitrary hosts; some providers treat
#     that as port scanning -- check yours (log_all_scans keeps an audit trail)
#   * [scanner.target] ip must be this server's PUBLIC address, or it never
#     finds anything (a warning is logged if it looks private)
#   * try action = "reject" first to watch what it finds
[scanner]

enabled = false

# "zline", "kline" or "reject" (disconnect only, no ban).
action = "zline"
ban_duration = "1d"

# %i = IP, %t = protocol that worked, %p = port.
reason = "Open %t proxy found on your host (port %p) -- secure it and reconnect"

# --- probes ---

# "type:port", types: http (CONNECT), httppost, socks4, socks5. One socket per
# entry per client, so keep it short.
protocols = [
    "http:80",
    "http:8080",
    "http:3128",
    "http:6588",
    "httppost:80",
    "httppost:8080",
    "socks4:1080",
    "socks5:1080",
]

# Seconds before a probe is abandoned.
timeout = 10.0

# Give up after reading this many bytes without a match.
max_read = 4096

# Most probe sockets open at once; past it new clients aren't scanned until
# it drains, so a flood can't exhaust file descriptors.
max_concurrent = 256

# Source address for probes ("" = system default).
bind = ""

# --- caching and logging ---

# Leave a clean address alone this long before scanning it again ("1h",
# "1d"; "0" = scan every connection). Saves work, but a proxy switched off
# for one scan then slips through.
negcache = "0"

# Log every probe result at DEBUG (log file only).
log_all_scans = false

# --- target: where probes relay to ---
[scanner.target]

# THIS server's public IPv4 address. Required when the scanner is on.
ip = ""

# A plain (non-TLS) client port on this server.
port = 6667

# Text that proves a relay worked: this server's connect banner plus the two
# refusals a relayed probe may get instead. Leave unset unless you know why.
#strings = [
#    "*** Looking up your hostname",
#    "ERROR :Closing Link",
#    "ERROR :Too many connections",
#]
