# =============================================================================
#  SekurIRCd -- server configuration (config/sekurircd.toml)
# =============================================================================
#  Quick start:  tools/makeconf.py  (or bin/sekurircd --makeconf) writes this
#                file for you after a few questions.
#  By hand:      1. cp config/sekurircd.template.toml config/sekurircd.toml
#                2. set [server] name/network and add one [[operators]] login
#                3. bin/sekurircd --config config/sekurircd.toml --check
#                4. ./sekurircd start
#
#  How to read this file:
#    [required]     must be set (in its block, when you use that block)
#    [recommended]  works without it, but set it for a real server
#    [optional]     leave it out and the value shown applies (the default)
#    A line starting with "#key =" is off / at its default: remove the "#" to
#    set it. Everything applies live with /REHASH, except [server] name and
#    sid (a restart). Relative paths are relative to THIS file, except
#    [logging] directory (relative to the working directory).
#
#  Related files (all next to this one):
#    ircd.motd, ircd.smotd, oper.motd, ircd.rules   texts (made from templates)
#    protection.toml     the Protection bundle: caps, floods, spam, DNSBL,
#                        proxy scanner (config/protection.template.toml)
#    spamfilters.conf    regex spam rules (config/spamfilters.template.conf)
#    ../services/services.toml   NickServ + ChanServ, network-wide [[opers]]
#
#  Contents:
#    include  [server]  [tls]  [websocket]  [security]  [messages]  [channels]
#    [limits]  [privacy]  [[operators]]  [admin]  [debug_channel]  [[classes]]
#    [[webirc]]  [[vhosts]]  [logging]  [links]  [[links.peers]]
# =============================================================================

# --- include: split the configuration over several files ---
# [optional] More [sections] / [[tables]] from other files (names or globs,
# relative to this file), read in order at start and on /REHASH. Each file
# must start with a [header], and a section may live in one file only. Must
# stay above every [section]. tools/confcheck.py and linkmgmt.py read this
# file only. e.g. include = ["opers.toml", "conf.d/*.toml"]
#include = ["conf.d/*.toml"]

# =============================================================================
#  [server] -- identity and plain-text client ports
# =============================================================================
[server]
# [required] Hostname shown to clients. Must contain a dot (clients read a
# dotless prefix as a nick). Restart to change: linked servers know it by name.
name = "irc.example.org"
# [recommended] Network name shown in the welcome message.
network = "SekuriIRC Network"
# [optional] Network icon URL (IRCv3 draft/ICON). "" = none.
#icon = "https://example.org/icon.png"
# [optional] Server ID on a linked network: a digit then two of 0-9 A-Z, unique
# across the network, e.g. "0AB". "" = derived from name. Restart to change.
#sid = ""
# [optional] Version string for 004/VERSION. Unset = the running build's.
#version = "0.8.4"
# [optional] Address to listen on: 0.0.0.0 = all interfaces, 127.0.0.1 = local only.
bind = "0.0.0.0"
# [optional] Plain-text client port.
port = 6667
# [optional] More plain-text ports on the same address; opened/closed on
# /REHASH, a busy one is skipped. Up to 16.
#extra_ports = [6668, 6669]
# [optional] Also listen on IPv6 (clients, TLS, WebSocket, links), on bind6.
# Every mask in this file accepts CIDR too, e.g. "2001:db8::/32".
#ipv6 = false
#bind6 = "::"
# [optional] IPv6 clients count per /64 for per-IP limits, throttles and
# cloaks (16-128; 128 = per address, easy to dodge).
#ipv6_limit_prefix = 64
# [optional] Load balancers that send PROXY protocol v1 with the real client
# IP (globs). Their connections must start with a PROXY line; anyone else's
# PROXY line is ignored, so it can't be spoofed.
#proxy_protocol_hosts = ["10.0.0.5"]

# =============================================================================
#  [tls] -- encrypted client port
# =============================================================================
[tls]
# [optional] Turn the TLS port on.
enabled = false
# [optional] TLS client port.
port = 6697
# [optional] More TLS ports with the same certificate (STS still names port).
#extra_ports = [7000, 9999]
# [required when enabled] PEM certificate (or chain) and its key.
#   Trusted:     tools/mkcert.sh --domain irc.example.org
#   Self-signed: openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#                  -keyout key.pem -out cert.pem -subj "/CN=irc.example.org"
cert_file = ""
key_file = ""
# [optional] Ask (never require) clients for a certificate: needed for SASL
# EXTERNAL (NickServ CERT ADD), WHOIS certfp and [[operators]] certfp.
request_client_cert = false
# [optional] IRCv3 STS: tell clients to always use TLS here for this many
# seconds, e.g. 31536000 (a year). 0 = don't advertise.
sts_duration = 0

# =============================================================================
#  [websocket] -- IRC over WebSocket, for browser clients
# =============================================================================
[websocket]
# [optional] Turn the WebSocket port on.
enabled = false
# [optional] WebSocket port.
port = 8080
# [optional] wss:// with the [tls] certificate (needs [tls] enabled). Or put a
# reverse proxy in front that does TLS.
tls = false
# [optional] Reverse proxies whose X-Forwarded-For / X-Real-IP is trusted for
# the real client address; anyone else's header is ignored.
#trusted_proxies = ["127.0.0.1"]
# [optional] Origins a browser must come from. [] = any. When set, clients
# without an Origin header (non-browsers) are refused.
#allowed_origins = ["https://chat.example.org"]

# =============================================================================
#  [security] -- protocol limits, cloaks, lookups, bans, opers
# =============================================================================
[security]
# [optional] Longest line accepted, in bytes.
max_line_length = 512
# [optional] Most parameters one command may carry.
max_params = 15
# [optional] Longest nickname.
max_nick_length = 30
# [optional] Seconds idle before the server PINGs, and seconds of silence
# before the client is dropped. ping_timeout must be the larger one.
ping_interval = 120
ping_timeout = 300
# [optional] The Protection bundle file (connection caps, floods, spam, DNSBL,
# proxy scanner). Missing file = all of it off. "" = never look for one.
protection_file = "protection.toml"
# [optional] Per-command rate limits: "<COMMAND> <most>/<seconds>"; past it the
# user gets "try again" (263). Opers are never limited; NICK counts only once
# registered. Can also live in protection.toml [flood]. Up to 8.
#command_limits = ["WHO 5/10", "LIST 2/30", "WHOIS 10/10", "NICK 3/60"]

# --- host cloaking: hide real IPs and hostnames from other users ---
# [optional] Turn cloaks on. Opers and the user still see the real host; bans
# match both.
host_masking = false
# [optional] Cloak template. {token} = keyed hash of the real host,
# {network} = [server] network lowercased, {suffix} = "users.{network}" or the
# real host's last labels (host_masking_keep_labels).
# e.g. "{token}.{suffix}" gives "a1b2c3d4.orange.es".
host_masking_format = "{token}.users.{network}"
# [optional] Bytes of hash in {token} (2 hex characters each).
host_masking_token_bytes = 4
# [optional] Labels of the resolved hostname kept in {suffix}: 2 keeps
# "orange.es", 3 suits "co.uk" domains. 0 = never show any of the real host.
host_masking_keep_labels = 0
# [optional] IP cloaks get the /24 and /16 (IPv6 /48 and /32) as labels, so
# ops can ban a range they can't see: *!*@*.1a2b3c4d.5e6f7a8b.users.net.
# Changes existing cloaks; set it alike on every linked server.
host_masking_ip_ranges = false
# [recommended] Key behind {token}. "" = random at each start (cloaks change on
# restart and differ between servers). Use the same one on every linked server.
host_masking_secret = ""

# --- lookups on connect ---
# [optional] Reverse DNS of the client IP (needed for hostname bans and
# keep_labels). Off = faster connects, bare IPs.
rdns_enabled = true
rdns_timeout = 3.0
# [optional] RFC 1413 ident lookup. Most hosts run no identd: mostly delay.
ident_enabled = false
ident_timeout = 3.0

# --- bans and reserved names ---
# [recommended] File that keeps K/G/Z-lines across restarts (Q-lines, RESVs
# and X-lines go to xlines.json beside it). "" = memory only.
# e.g. klines_file = "klines.json"
klines_file = ""
# [optional] Nicks no local client may take, so nobody poses as a service.
reserved_nicks = ["nickserv", "chanserv", "operserv", "memoserv", "hostserv", "botserv"]
# [optional] Modes every client gets on connect (self modes only: i w d T s B
# g Z p I R D; never o).
default_user_modes = "iw"

# --- operators (the logins are [[operators]] below) ---
# [optional] Modes every /OPER gets. o is always set; also allowed: the modes
# above plus oper-only H, q, W and F. A login's own `modes` replaces it.
oper_modes = "+osw"
# [optional] Channel opers join after /OPER (lock it with +i or +k yourself).
#oper_auto_join = "#opers"
# [optional] Give opers a recognisable host after /OPER.
oper_host_masking = false
oper_host_format = "netadmin.{network}"
# [optional] Take network-wide opers from services ([[opers]] in
# services.toml). false = ignore them, and take back given ones on /REHASH.
accept_services_opers = true
# [optional] Extra password for /DIE and /RESTART on top of being an oper.
# Hash with: sekurircd --hash-password. Plain-text forms also work
# (tools/confcheck.py --fix --write hashes them). Unset = being an oper is enough.
#die_password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#restart_password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#die_password = ""
#restart_password = ""

# =============================================================================
#  [messages] -- texts, message size, history
# =============================================================================
[messages]
# [optional] Text files (made from their templates on first start). An
# ircd.smotd next to the MOTD is shown on connect instead, and the full MOTD on
# /MOTD (cp ircd.template.smotd ircd.smotd).
motd = "ircd.motd"
oper_motd = "oper.motd"
rules = "ircd.rules"
# [optional] Longest PRIVMSG/NOTICE text in bytes; longer is cut.
max_message_length = 400
# [optional] Lines of history kept per channel for IRCv3 CHATHISTORY
# (about 0.7 KB each). 0 = off, at most 500.
history_size = 50
# [optional] Keep history across restarts (saved every 30 s and on shutdown).
# "" = memory only.
#history_file = "history.json"
# [optional] Also keep private messages between two logged-in accounts.
#history_dm = true
# [optional] Also keep joins, parts, kicks, modes, topics, nicks and reactions
# (for draft/event-playback). Never for +D / +u channels.
#history_events = true
# [optional] Refuse lines that aren't valid UTF-8 (IRCv3 UTF8ONLY).
#utf8_only = true
# [optional] Client tags not relayed (names without "+"). e.g. "typing" stops
# typing notices; "*,-draft/react,-draft/reply" keeps only reactions and
# replies. "" = relay all.
#client_tag_deny = ""
# [optional] Words starred out in +G channels (case-insensitive).
#censor_words = ["badword", "otherword"]

# =============================================================================
#  [channels] -- who may create channels, and their defaults
# =============================================================================
[channels]
# [optional] Only opers may create channels (anyone may join existing ones).
restrict_creation = false
# [optional] Channels anyone may still create when restrict_creation is on.
# e.g. allowed_channels = ["#help", "#lobby"]
allowed_channels = []
# [optional] Modes of a new channel (any of n t i p s m).
default_modes = "nt"
# [optional] Channels every client joins on connect (they may /PART).
# e.g. auto_join = ["#lobby"]
auto_join = []

# =============================================================================
#  [limits] -- sizes (the defaults are what SekurIRCd always used)
# =============================================================================
# Keys marked * are advertised to clients (ISUPPORT): set them alike on every
# server of a network, so clients see one set of rules.
[limits]
# [optional] * Channels one user may be in (CHANLIMIT), 1-500. Override opers ignore it.
channels_per_user = 200
# [optional] * Entries in each ban / exception / invite-exception list
# (MAXLIST), 1-500; about 330 bytes per slot in use.
max_list_size = 100
# [optional] * Longest topic (1-307), kick reason (1-300), away message (1-399)
# and channel name (10-50), in bytes.
topic_length = 307
kick_length = 300
away_length = 399
channel_length = 50
# [optional] * MONITOR (1-500) and SILENCE (1-100) list sizes.
monitor_entries = 100
silence_entries = 15
# [optional] * Parameter-taking mode changes in one MODE command (MODES), 1-12.
modes_per_command = 6
# [optional] Departed users /WHOWAS remembers, 0-2000 (0 = no WHOWAS). A change
# starts the list over.
whowas_entries = 200
# [optional] Seconds a new connection has to finish registering, 5-600.
registration_timeout = 60

# =============================================================================
#  [privacy] -- what ordinary users may learn (all off; opers see everything)
# =============================================================================
#[privacy]
# [optional] LINKS and MAP show non-opers only this server.
#hide_links = false
# [optional] A name shown instead of every server's real one in WHOIS, WHO,
# LINKS, MAP and netsplit quits ("*.net *.split"). Implies hide_links.
# e.g. hide_server_name = "*.example.net"
#hide_server_name = ""
# [optional] WHOIS idle/signon time only for the user themself and opers.
#hide_idle = false
# [optional] PART and QUIT reasons are not shown to other users.
#hide_part_quit_reasons = false
# [optional] NAMES of a channel you are not in lists nobody.
#names_members_only = false

# =============================================================================
#  [[operators]] -- /OPER logins on THIS server (one block per login)
# =============================================================================
#   name           [required] the login name: /OPER <name> <password>
#   hosts          [required] ident@host masks it may /OPER from ("*@*" = anywhere)
#   password_hash  [required, one of] scrypt string from `sekurircd --hash-password`
#   password       [required, one of] plain text (confcheck --fix --write hashes it)
#   certfp         [optional] SHA-256 fingerprints of TLS client certificates
#                  (colons fine); /OPER then also needs a matching certificate
#                  ([tls] request_client_cert). With no password at all the
#                  certificate is the login: /OPER <name>. Fingerprint:
#                  openssl x509 -in client.crt -noout -fingerprint -sha256
#   privileges     [optional] limit the login; unset = everything:
#                    kill      KILL            kline   K/G/Z/Q/X-LINE, RESV, SHUN,
#                    sa        SAJOIN/SAPART/          ELINE, SPAMFILTER, CLASS,
#                              SAMODE/SANICK           DEFCON, PROTECT
#                    host      CHGHOST/SETHOST/CHGIDENT/USERIP, VHOST ADD|DEL
#                    wallops   WALLOPS/GLOBOPS rehash  REHASH
#                    die       DIE/RESTART     link    SQUIT/CONNECT
#                    override  past channel rules (+i/+k/+l/+b/+m/+n/+t, kick
#                              anyone, MODE without ops, PM past +D/+R/+g/+Z)
#                    auspex    see hidden info (real hosts, +i users, +p
#                              channels, +H opers, idle, keys, TRACE)
#                    immune    exempt from SHUN, spam filters, +f/+j
#                    all       everything;   [] = none (a helper)
#   modes          [optional] replaces [security] oper_modes for this login
# For opers on EVERY server use [[opers]] in services.toml; keep one login here
# anyway for when services are down.
#[[operators]]
#name = "admin"
#password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#password = "legacy-plaintext-example-do-not-use-in-production"
#hosts = ["*@*"]
#privileges = ["kill", "kline", "wallops"]
#modes = "+oswW"
#certfp = ["0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"]

# =============================================================================
#  [admin] -- what /ADMIN shows (unset = "Not configured")
# =============================================================================
#[admin]
# [optional] Two free-text lines and a contact address.
#location1 = "Somewhere, Some Country"
#location2 = "Some Organization"
#email = "admin@example.com"

# =============================================================================
#  [debug_channel] -- the server's log, live in an oper-only channel
# =============================================================================
# Only opers can join (others are told it doesn't exist). On a network enable
# it with the same name everywhere and set /MODE #server-debug +OsP once.
[debug_channel]
# [optional] Turn it on.
enabled = false
# [optional] The channel (also put it in [security] oper_auto_join).
name = "#server-debug"
# [optional] Lowest level shown: DEBUG, INFO, WARNING, ERROR or CRITICAL.
# INFO adds connects, oper actions and link changes.
min_level = "WARNING"
# [optional] Seconds between stats lines (needs min_level INFO). 0 = off.
stats_interval = 0
# [optional] Services pidfile, to add their CPU/memory to the stats line.
# e.g. chanserv_pidfile = "../services/services.pid"
chanserv_pidfile = ""

# =============================================================================
#  [[classes]] -- other limits for some addresses (first match wins)
# =============================================================================
#   name            [required] the class name (letters, digits, _ . -)
#   hosts           [required] IP globs or CIDR ranges, IPv4 and IPv6 mixed.
#                   Prefer CIDR for IPv6 ("2001:db8:1::/48"): globs match the
#                   short spelling ("c8", not "00c8"), which can miss.
#   max_clients     [optional] connections in this class (0 = no limit)
#   max_per_ip      [optional] replaces the per-IP connection cap
#   sendq_max       [optional] bytes queued for a slow reader (4096-16777216)
#   flood_max_msgs  [optional] with flood_window (seconds): replaces the flood guard
#   scope           [optional] "local" (default) or "global": sent to every
#                   linked server, each applying it to its own connections
#                   (see [links] accept_global_classes). Older servers ignore it.
# 0 or unset = the global setting. Opers can add/remove classes live, kept in
# classes.json: /CLASS ADD [GLOBAL] <name> <hosts> [max_per_ip=N ...],
# /CLASS DEL <name>, /CLASS (list).
#[[classes]]
#name = "office"
#hosts = ["192.0.2.*", "2001:db8:1::/48"]
#max_clients = 200
#max_per_ip = 50
#sendq_max = 0
#flood_max_msgs = 40
#flood_window = 10.0
#scope = "local"

# =============================================================================
#  [[webirc]] -- trusted web gateways (KiwiIRC, The Lounge, ...)
# =============================================================================
# The gateway passes each web user's real IP, so bans and limits hit the user,
# not the gateway.
#   name      [optional] a label for logs
#   password  [required] the gateway's WEBIRC password
#   hosts     [required] the gateway's IP globs
#[[webirc]]
#name = "kiwi"
#password = "change-me"
#hosts = ["203.0.113.10"]

# =============================================================================
#  [[vhosts]] -- hosts people may switch to with /VHOST <host> (this server)
# =============================================================================
#   host           [required] the virtual host
#   allowed_hosts  [optional] ident@host or IP masks that may use it
#   accounts       [optional] logged-in accounts that may use it, from anywhere
#   password_hash  [optional] scrypt from `sekurircd --hash-password`, or
#   password       [optional] plain text (not both): then /VHOST <host> <password>
# allowed_hosts or accounts are enough on their own; with a password too, both
# are needed. A password alone opens it to anyone who knows it (not listed by
# /VHOST). None of them = opers only (opers never need the password).
# For vhosts that follow an ACCOUNT to every server, an oper uses
# /VHOST ADD <account> <host> instead (kept by services; picked with /VHOST <host>).
#[[vhosts]]
#host = "elite.users.example.com"
#allowed_hosts = ["*@203.0.113.42", "198.51.100.*"]
#accounts = ["alice", "bob"]
#password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"

# =============================================================================
#  [logging] -- log files, audit log, syslog
# =============================================================================
[logging]
# [optional] false = console only, no log file.
enabled = true
# [optional] Log directory, created if missing (relative to the working directory).
directory = "logs"
# [optional] Lowest level written: DEBUG, INFO, WARNING, ERROR, CRITICAL.
level = "INFO"
# [optional] true = DEBUG level and every line in and out (very verbose).
debug = false
# [optional] Log file, rotated at max_bytes with backup_count old copies kept.
file = "sekurircd.log"
max_bytes = 5242880
backup_count = 5
# [optional] Audit log: one line per oper action (OPER logins and failures,
# KILL, the *-LINEs, SPAMFILTER, CLASS, DEFCON, REHASH, DIE...; passwords left
# out). In `directory`, or an absolute path; rotated like the log. "" = none.
#audit_file = "audit.log"
# [optional] Also send log and audit lines to syslog (ident "sekurircd").
#syslog = false

# =============================================================================
#  [links] -- server linking and services
# =============================================================================
# Needed for a network of servers and for services (NickServ + ChanServ link in
# like a server). Each server needs its own name and sid and the same
# host_masking_secret. tools/linkmgmt.py adds, edits and tests links for you.
[links]
# [optional] Turn the link listener / dialing on.
enabled = false
# [optional] "hub" accepts links, "leaf" only dials out, "both" does both.
mode = "hub"
# [optional] The link listener (hub), apart from client ports. macOS may use
# 7000 itself: pick another port if it won't bind.
bind = "0.0.0.0"
port = 7000
# [optional] The link listener's IPv6 address, when [server] ipv6 is on.
#bind6 = "::"
# [optional] TLS on links: a hub uses the [tls] cert/key, a leaf requires TLS
# to its hub. Plain text is still taken from this machine (local services).
tls = false
# [optional] Leaf: skip CA checks of the hub's certificate. Prefer a peer
# `fingerprint`, which replaces this.
tls_insecure_skip_verify = false
# [optional] Dial peers with a `host` at start and after a drop (false = only /CONNECT).
#autoconnect = true
# [optional] Apply [[classes]] other servers publish (scope = "global").
# false = keep to this server's own (they are still passed on).
#accept_global_classes = true
# [optional] Link keepalive, in seconds.
ping_interval = 60.0
ping_timeout = 180.0
# [optional] Reconnect backoff in seconds, doubling up to the max.
reconnect_delay = 5.0
reconnect_delay_max = 300.0
# [optional] Longest line accepted from a linked server, in bytes.
#max_line_length = 8192

# =============================================================================
#  [[links.peers]] -- one block per server (or services) this one links with
# =============================================================================
#   name           [required] the peer's own server name
#   host / port    [required on the DIALING side only] where to reach it
#   password_hash  [required, one of] accepting side: `sekurircd --hash-password`
#   password       [required, one of] plain; the dialing side must use this one
#   fingerprint    [optional] "sha256:<hex>" of the peer's certificate (needs
#                  [links] tls); checked before the password, which may then
#                  be left out. Get it: tools/linkmgmt.py fingerprint
#   allowed_ips    [optional] accepting side: IP globs the peer may come from
#   introduces     [optional] server-name globs that may appear BEHIND this
#                  peer (unset = any). Others are refused, and its introducer
#                  is asked to drop them; the link stays up. List services too.
#                  e.g. ["*.eu.example.net", "services.example.net"]
#   leaf           [optional] true = nothing may link behind it (the link is
#                  closed if something does). Not together with introduces.
#   oper_scope     [optional, hub side] "global" (default) or "local": that
#                  leaf's opers act only on their own server (no remote KILL,
#                  GLINE/SHUN, Q/X-lines, RESV, global CLASS, VHOST ADD, remote
#                  SQUIT/REHASH/STATS...). Hub opers are never limited.
#   oper_deny      [optional, hub side] privileges taken from that leaf's opers
#                  (names as in [[operators]]); a limited leaf usually denies
#                  "override" too.
# Removing an entry (or an address from allowed_ips) and /REHASH closes that
# link at once; a changed password or fingerprint does not (use /SQUIT).

# Hub side: a leaf that connects in.
#[[links.peers]]
#name = "leaf1"
#password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#allowed_ips = ["203.0.113.5"]

# Hub side: a leaf run by someone else, kept to its own server and region.
#[[links.peers]]
#name = "leaf2"
#password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#oper_scope = "local"
#oper_deny = ["override", "auspex"]
#introduces = ["*.eu.example.net"]
#leaf = false

# Hub side: services (bin/services); same name and plain password as [link]
# in services/services.toml.
#[[links.peers]]
#name = "services.sekurircd.local"
#password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#allowed_ips = ["127.0.0.1"]

# Leaf side (mode = "leaf"): the hub to dial; name = the HUB's name.
#[[links.peers]]
#name = "hub1"
#host = "hub.example.net"
#port = 7000
#password = "a-long-shared-secret-unique-to-this-pair"
#fingerprint = "sha256:<64 hex digits>"
