# =============================================================================
#  SekurIRCd -- server configuration template
# =============================================================================
#
#  Quick start:
#    tools/makeconf.py          asks a few questions and writes this file for you
#                               (also: bin/sekurircd --makeconf)
#  By hand:
#    1. cp config/sekurircd.template.toml config/sekurircd.toml
#    2. edit it -- at least [server] name/network and one [[operators]] login
#    3. bin/sekurircd --config config/sekurircd.toml --check
#    4. ./sekurircd start
#
#  Every key is optional: the value shown (commented out or not) is the
#  built-in default unless noted. Changes apply live with /REHASH.
#
#  Relative paths: motd/rules/klines/history files and TLS cert/key resolve
#  against this file's directory; [logging] directory against the working
#  directory.
#
#  Related files:
#    ircd.motd, oper.motd, ircd.rules   MOTD, oper MOTD, /RULES text (made from
#                                       their templates on first start)
#    protection.toml                    the Protection bundle (optional; copy
#                                       config/protection.template.toml)
#    ../services/services.toml          NickServ + ChanServ
#
#  Sections:
#    SERVER       [server]
#    LISTENERS    [tls]  [websocket]
#    SECURITY     [security]
#    MESSAGES     [messages]
#    CHANNELS     [channels]
#    OPERATORS    [[operators]]  [admin]  [debug_channel]
#    CONNECTIONS  [[classes]]  [[webirc]]  [[vhosts]]
#    LOGGING      [logging]
#    LINKING      [links]  [[links.peers]]
# =============================================================================


# =============================================================================
#  SERVER
# =============================================================================
[server]

# Hostname shown to clients. Must contain a dot: clients read a dotless
# prefix as a nick.
name = "irc.example.org"

# Network name shown in the welcome message.
network = "SekuriIRC Network"

# Network icon URL, advertised as IRCv3 draft/ICON. "" = none.
#icon = "https://example.org/icon.png"

# Server ID on a linked network: 3 characters, a digit then two of 0-9 A-Z
# (e.g. "0AB"), unique across the network. "" (default) derives one from
# [server] name, which is fine unless two server names happen to derive the same
# one -- the link is then refused and you set a different sid on one of them.
#sid = ""

# Version string for 004/VERSION. Leave unset to report the running build.
#version = "0.8.4"

# --- listening ---

# 0.0.0.0 = all interfaces, 127.0.0.1 = this machine only.
bind = "0.0.0.0"

# Plaintext client port.
port = 6667

# Also listen on IPv6 (every listener: clients, TLS, WebSocket, links).
# Masks everywhere accept CIDR too, e.g. "2001:db8::/32".
#ipv6 = false
#bind6 = "::"

# IPv6 clients are counted per /64 (one subscriber) for per-IP limits,
# throttles and cloaks. 128 = per address (easy to dodge).
#ipv6_limit_prefix = 64

# --- load balancers ---

# Hosts (globs) that speak PROXY protocol v1 to pass on the real client IP.
# Connections from them must start with a PROXY line; from anyone else a
# PROXY line is ignored, so it can't be spoofed.
#proxy_protocol_hosts = ["10.0.0.5"]


# =============================================================================
#  LISTENERS
# =============================================================================

# -----------------------------------------------------------------------------
#  [tls] -- encrypted client port, next to the plaintext one
# -----------------------------------------------------------------------------
[tls]

enabled = false
port = 6697

# PEM certificate (or chain) and its key, relative to this file. Required when
# enabled. A self-signed certificate works (clients must allow it):
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout key.pem -out cert.pem -subj "/CN=irc.example.org"
# For a trusted one: tools/mkcert.sh --domain irc.example.org
cert_file = ""
key_file = ""

# Ask (never require) clients for a certificate, so a fingerprint bound with
# /CERT ADD can log in through SASL EXTERNAL. Needs services running.
request_client_cert = false

# IRCv3 STS: tell clients to always use TLS here for this many seconds.
# 0 = don't advertise it.
sts_duration = 0

# -----------------------------------------------------------------------------
#  [websocket] -- IRC over WebSocket, for browser clients
# -----------------------------------------------------------------------------
[websocket]

enabled = false
port = 8080

# wss://, using the [tls] certificate (needs [tls] enabled). Or terminate TLS
# in a reverse proxy instead.
tls = false

# Reverse proxies whose X-Forwarded-For / X-Real-IP is trusted for the real
# client address. Everyone else's header is ignored.
#trusted_proxies = ["127.0.0.1"]

# Origins a browser must come from, e.g. ["https://chat.example.org"].
# Empty = any. When set, non-browser clients (no Origin) are refused.
#allowed_origins = []


# =============================================================================
#  SECURITY
# =============================================================================
[security]

# --- protocol limits ---

# Longest line accepted, in bytes.
max_line_length = 512

# Most parameters one command may carry.
max_params = 15

# Longest nickname.
max_nick_length = 30

# --- keepalive ---

# Seconds idle before the server sends PING, and seconds of total silence
# before the client is dropped. ping_timeout must be greater.
ping_interval = 120
ping_timeout = 300

# --- Protection bundle ---

# Connection caps, flood and spam protection, DNSBL and the proxy scanner live
# in this file (see config/protection.template.toml). Relative to this file.
# Missing file = built-in defaults (all of it off). "" = never look for one.
protection_file = "protection.toml"

# --- host cloaking ---

# Hide users' real IPs and hostnames from other users. Opers, and the user
# themselves, still see the real one in /WHOIS; bans still match it.
host_masking = false

# Cloak template:
#   {token}    keyed hash of the real host (stable, can't be reversed)
#   {network}  [server] network, lowercased
#   {suffix}   "users.{network}", or the real host's last labels once rDNS
#              resolves (see host_masking_keep_labels)
# For an UnrealIRCd-style "a1b2c3d4.orange.es" use "{token}.{suffix}".
host_masking_format = "{token}.users.{network}"

# Hash bytes in {token} (2 hex characters each).
host_masking_token_bytes = 4

# Labels of the resolved hostname kept in {suffix} (2 keeps "orange.es").
# 0 = never show the real host. "co.uk"-style domains need 3.
host_masking_keep_labels = 0

# Key behind {token}. Empty = random at each start, so cloaks change on every
# restart and differ between linked servers. Set one (and the same one on
# every linked server) for stable cloaks. Keep it out of version control.
host_masking_secret = ""

# Give opers a recognizable host after /OPER, e.g. netadmin.<network>.
oper_host_masking = false
oper_host_format = "netadmin.{network}"

# --- lookups on connect ---

# Reverse DNS of the client IP. Needed for hostname bans and
# host_masking_keep_labels; off = faster connects, bare IPs.
rdns_enabled = true
rdns_timeout = 3.0

# RFC 1413 ident check. Most hosts run no identd, so it mostly adds delay.
ident_enabled = false
ident_timeout = 3.0

# --- bans ---

# File that keeps K/G/Z-lines across restarts, relative to this file.
# "" = in memory only.
klines_file = ""

# Nicks no local client may take (services use them). Stops anyone from
# posing as NickServ to collect passwords. [] = none.
reserved_nicks = ["nickserv", "chanserv", "operserv", "memoserv", "hostserv", "botserv"]

# --- user modes ---

# Set on every client after it connects. Self modes only: i (invisible),
# w (wallops), d (deaf), T (no CTCP), s (server notices), B (bot), g, Z.
# +o can never be given this way.
default_user_modes = "iw"

# Modes every /OPER gets. o is always included; others allowed: the ones
# above, plus p, I, R, D and the oper-only H, q, W. An [[operators]] login's
# own `modes` replaces this for that login.
oper_modes = "+osw"

# Channel opers are joined to after /OPER. Not locked down automatically: use
# channel modes (+i, +k) to keep others out.
#oper_auto_join = "#opers"

# --- /DIE and /RESTART ---

# Extra password for /DIE and /RESTART on top of being an oper.
# Empty = being an oper is enough. Hash with: sekurircd --hash-password
#die_password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#restart_password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
# Plain-text versions (tools/confcheck.py --fix --write hashes them):
#die_password = ""
#restart_password = ""


# =============================================================================
#  MESSAGES
# =============================================================================
[messages]

# Text files, relative to this file (made from their templates on first start).
motd = "ircd.motd"
oper_motd = "oper.motd"
rules = "ircd.rules"

# Longest PRIVMSG/NOTICE text, in bytes; longer is truncated.
max_message_length = 400

# --- history (IRCv3 CHATHISTORY) ---

# Lines kept per channel for scrollback and catch-up. About 0.7 KB per line.
# 0 = off, max 500.
history_size = 50

# Keep history across restarts (written every 30s and on shutdown, readable
# only by the ircd's user). "" = memory only.
#history_file = "history.json"

# Also keep private messages between two logged-in accounts.
#history_dm = true

# Also keep joins, parts, kicks, modes, topics, nick changes and reactions
# (shown to clients with draft/event-playback). Not for +D / +u channels.
#history_events = true

# --- content ---

# Refuse any line that isn't valid UTF-8 (IRCv3 UTF8ONLY). Turn off only for
# users on legacy charsets.
#utf8_only = true

# Client tags not relayed, names without "+". "typing" blocks typing
# notifications; "*,-draft/react,-draft/reply" blocks all but reactions
# and replies. "" = relay all.
#client_tag_deny = ""

# Words starred out in channels with +G (case-insensitive).
#censor_words = ["badword", "otherword"]


# =============================================================================
#  CHANNELS
# =============================================================================
[channels]

# Only opers may create new channels (anyone may still join existing ones).
restrict_creation = false

# Channels anyone may create even when restrict_creation is on.
allowed_channels = []

# Modes for a newly created channel: n, t, i, p, s, m.
default_modes = "nt"

# Channels every client joins after connecting (they may /PART).
auto_join = []


# =============================================================================
#  OPERATORS
# =============================================================================

# -----------------------------------------------------------------------------
#  [[operators]] -- /OPER logins (none by default; add one per oper)
# -----------------------------------------------------------------------------
#   name           login name for /OPER
#   password_hash  from `sekurircd --hash-password` (recommended), or
#   password       plain text (tools/confcheck.py --fix --write hashes it)
#   hosts          ident@host masks this login may /OPER from; "*@*" = anywhere
#   privileges     limit the login to some oper commands; unset = all:
#                    kill     KILL             kline    K/G/Z-LINE, SPAMFILTER, PROTECT
#                    sa       SAJOIN/SAPART/SAMODE/SANICK
#                    host     CHGHOST/SETHOST/CHGIDENT/USERIP
#                    wallops  WALLOPS/GLOBOPS  rehash   REHASH
#                    die      DIE/RESTART      link     SQUIT/CONNECT
#                    all      everything;  [] = none of these (a helper)
#   modes          replaces [security] oper_modes for this login
# Add or change one, then /REHASH. Services admins are set in services.toml.
#
#[[operators]]
#name = "admin"
#password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#password = "legacy-plaintext-example-do-not-use-in-production"
#hosts = ["*@*"]
#privileges = ["kill", "kline", "wallops"]
#modes = "+oswW"

# -----------------------------------------------------------------------------
#  [admin] -- what /ADMIN shows (unset = "Not configured")
# -----------------------------------------------------------------------------
#[admin]
#location1 = "Somewhere, Some Country"
#location2 = "Some Organization"
#email = "admin@example.com"

# -----------------------------------------------------------------------------
#  [debug_channel] -- the server's own log, live in an oper-only channel
# -----------------------------------------------------------------------------
# Only opers can join it (others are told it doesn't exist). Set
# [security] oper_auto_join to the same name to put opers in automatically.
[debug_channel]

enabled = false
name = "#server-debug"

# DEBUG, INFO, WARNING, ERROR or CRITICAL. INFO adds connects, oper actions
# and link changes.
min_level = "WARNING"

# Seconds between stats lines (users, channels, bans, CPU and memory, what the
# Protection bundle caught). Needs min_level = "INFO". 0 = off.
stats_interval = 0

# Services pidfile, to add their CPU and memory to the stats line. "" = don't.
chanserv_pidfile = ""


# =============================================================================
#  CONNECTIONS
# =============================================================================

# -----------------------------------------------------------------------------
#  [[classes]] -- different limits for some hosts
# -----------------------------------------------------------------------------
# A client gets the FIRST class whose `hosts` (IP globs) match. Every limit is
# optional; 0 or unset = the global setting.
#   max_clients     connections in this class
#   max_per_ip      replaces the per-IP connection cap
#   sendq_max       bytes queued for a slow reader before "SendQ exceeded"
#   flood_max_msgs / flood_window   replace the flood guard
#
#[[classes]]
#name = "office"
#hosts = ["192.0.2.*"]
#max_clients = 200
#max_per_ip = 50
#sendq_max = 0
#flood_max_msgs = 40
#flood_window = 10.0

# -----------------------------------------------------------------------------
#  [[webirc]] -- trusted web gateways (KiwiIRC, The Lounge, ...)
# -----------------------------------------------------------------------------
# Lets a gateway pass on each web user's real IP with WEBIRC, so bans and
# limits hit that user, not the whole gateway. Both the gateway's IP (`hosts`,
# required) and the password must match.
#
#[[webirc]]
#name = "kiwi"
#password = "change-me"
#hosts = ["203.0.113.10"]

# -----------------------------------------------------------------------------
#  [[vhosts]] -- hosts users can switch to with /VHOST
# -----------------------------------------------------------------------------
# allowed_hosts: ident@host or IP masks (never nicks, which anyone can take).
# A bare mask means any ident. Opers may use any vhost; leave allowed_hosts
# empty for an oper-only one.
#
#[[vhosts]]
#host = "elite.users.example.com"
#allowed_hosts = ["*@203.0.113.42", "198.51.100.*"]


# =============================================================================
#  LOGGING
# =============================================================================
[logging]

# false = console only, no log file.
enabled = true

# Created if missing. Relative = to the working directory.
directory = "logs"

# Minimum level written: DEBUG, INFO, WARNING, ERROR, CRITICAL.
level = "INFO"

# true = log every line in and out (very verbose), whatever `level` says.
debug = false

# File name, rotated at max_bytes, keeping backup_count old files
# (5 x 5 MiB = about 25 MiB).
file = "sekurircd.log"
max_bytes = 5242880
backup_count = 5


# =============================================================================
#  LINKING -- multi-server networks and services
# =============================================================================
# Off by default. Also needed for services (NickServ + ChanServ), which link
# in like a server. Linked servers form a tree and share users, channels,
# bans and accounts. Each needs its own [server] name and sid, and the same
# host_masking_secret. Different versions link as long as their link protocol
# overlaps. tools/linkmgmt.py adds, edits and tests links for you.
[links]

enabled = false

# "hub" accepts links, "leaf" only dials out, "both" does both.
mode = "hub"

# Where the link listener binds (hub). Separate from the client ports.
# macOS sometimes uses 7000 itself: pick another port if it won't bind.
bind = "0.0.0.0"
port = 7000

# The link listener's IPv6 address, when [server] ipv6 is on.
#bind6 = "::"

# TLS on links: a hub uses the [tls] cert/key on the link listener, a leaf
# requires TLS to its uplink. Local plain-text links (services) still work.
tls = false

# Leaf: accept the hub's certificate without CA validation. Prefer pinning a
# `fingerprint` on the peer, which replaces this.
tls_insecure_skip_verify = false

# Dial the peers that have a `host` at start and after a drop. false = only
# on /CONNECT.
#autoconnect = true

# --- timing ---

ping_interval = 60.0
ping_timeout = 180.0

# Reconnect backoff in seconds, doubling up to the max.
reconnect_delay = 5.0
reconnect_delay_max = 300.0

# Longest line accepted from a linked server, in bytes.
#max_line_length = 8192

# -----------------------------------------------------------------------------
#  [[links.peers]] -- one per server (or services) this one links with
# -----------------------------------------------------------------------------
#   name           the peer's own server name, as it presents itself
#   host / port    set on the DIALING side only; the other side accepts
#   password_hash  accepting side (from `sekurircd --hash-password`), or
#   password       plain; the dialing side must use the plain one
#   fingerprint    "sha256:<hex>" of the peer's certificate (needs tls = true).
#                  Checked before any password; with it, the password may be
#                  left out. Get it with: tools/linkmgmt.py fingerprint
#   allowed_ips    IP globs the peer may connect from (accepting side)

# Hub side: a leaf that connects in.
#[[links.peers]]
#name = "leaf1"
#password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#allowed_ips = ["203.0.113.5"]

# Hub side: services (bin/services). Same name and plain password as [link]
# in services/services.toml.
#[[links.peers]]
#name = "services.sekurircd.local"
#password_hash = "scrypt$16384$8$1$<salt-hex>$<digest-hex>"
#allowed_ips = ["127.0.0.1"]

# Leaf side (with mode = "leaf"): the hub to dial. name = the HUB's name.
#[[links.peers]]
#name = "hub1"
#host = "hub.example.net"
#port = 7000
#password = "a-long-shared-secret-unique-to-this-pair"
#fingerprint = "sha256:<64 hex digits>"   # the hub's certificate (see above)
