# =============================================================================
#  SekurIRCd services -- NickServ + ChanServ (bin/services)
# =============================================================================
#
#  One process for the whole network: accounts, SASL, nick and channel
#  registration. It links to the ircd like a server; run exactly ONE copy.
#
#  Setup:
#    1. cp services/services.template.toml services/services.toml
#    2. in sekurircd.toml: [links] enabled, plus a [[links.peers]] entry with
#       the same name and password as [link] below
#    3. ./sekurircd start   (starts the ircd and services together)
#
#  Or let tools/makeconf.py write both files with matching settings.
#  Without services there is no NickServ, no ChanServ and no SASL.
# =============================================================================


# -----------------------------------------------------------------------------
#  LINK -- how services connect to the ircd
# -----------------------------------------------------------------------------
[link]

# The ircd's link listener ([links] bind/port), not its client port.
host = "127.0.0.1"
port = 7000

# Must match a [[links.peers]] entry in sekurircd.toml. Keep the PLAIN
# password here (services send it); the ircd side may store a password_hash.
name = "services.sekurircd.local"
password = "change-me-to-a-long-shared-secret"


# -----------------------------------------------------------------------------
#  CHANSERV -- channel registration
# -----------------------------------------------------------------------------
[chanserv]

nick = "ChanServ"
user = "ChanServ"
host = "services.sekurircd.local"
realname = "Channel Registration Service"

# Drop a registration nobody has used (IDENTIFY or any password command) for
# this many days. 0 = never expire.
#expire_days = 0

# What the founder gets on IDENTIFY or CLAIM: "o" = channel op (@),
# "q" = channel owner (~).
#founder_mode = "o"


# -----------------------------------------------------------------------------
#  NICKSERV -- accounts, SASL, nick ownership
# -----------------------------------------------------------------------------
[nickserv]

# false = ChanServ only (then nothing offers accounts or SASL).
#enabled = true
#nick = "NickServ"

# Defaults to [chanserv] host.
#host = "services.sekurircd.local"

# --- account database ---

# JSON file, relative to this file's directory. Unset = reuse the old
# ircd-side accounts.json if there is one, else nickserv.json next to this
# file. Rotating backups (<file>.bak1..N) are kept, and a corrupt file is
# never overwritten: the newest good backup is loaded instead.
#store_file = "../config/accounts.json"
#backup_count = 5

# Most accounts allowed. 0 = unlimited.
#max_accounts = 10000

# --- administration ---

# Accounts allowed SUSPEND, UNSUSPEND, FDROP, SASET PASSWORD and full INFO.
#admins = ["youraccount"]

# --- nick ownership ---

# Someone using a registered nick must log in within enforce_grace seconds
# or is renamed to Guest<number>, on every server of the network.
#enforce_nicks = false
#enforce_grace = 60

# Always-on: users can run /msg NickServ SET ALWAYS-ON ON so their nick stays
# online (in its channels, marked away) after they disconnect, and reconnecting
# with SASL resumes it (on another server of the network too: there the
# channels see a quit and a rejoin). false turns the command off.
# always_on_expire_days: how long a disconnected always-on nick is kept, counted
# from when it disconnected, also across ircd restarts (0 = never expires).
#always_on = true
#always_on_expire_days = 30

# --- email verification and password resets ---

# SET EMAIL and RESETPASS run, without a shell:
#   <email_command> <address> <code> <account> <network> verify|reset
# Point it at a small script that mails the code. Empty = no mail (addresses
# stay unverified, no self-service reset). network defaults to the ircd's
# [server] network.
#email_command = "/usr/local/bin/send-verification"
#network = "SekurNet"


# -----------------------------------------------------------------------------
#  STORAGE -- ChanServ's registrations
# -----------------------------------------------------------------------------
[storage]

# Relative to the directory bin/services runs from (not this file).
path = "chanserv.json"

# Rotating backups (<path>.bak1 = newest). A missing or corrupt file falls
# back to the newest readable backup.
backup_count = 5
