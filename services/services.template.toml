# =============================================================================
#  SekurIRCd services -- NickServ + ChanServ (services/services.toml)
# =============================================================================
#  One process for the whole network: accounts, SASL, nick and channel
#  registration, account vhosts and network-wide opers. It links to the hub
#  like a server; run exactly ONE copy. Without it: no NickServ, ChanServ or SASL.
#
#  Setup:  1. cp services/services.template.toml services/services.toml
#          2. in sekurircd.toml: [links] enabled and a [[links.peers]] entry
#             with the same name and password as [link] below
#          3. ./sekurircd start   (starts the ircd and services together)
#          (tools/makeconf.py writes both files with matching settings.)
#
#  How to read this file:
#    [required]     must be set
#    [recommended]  works without it, but set it for a real network
#    [optional]     leave it out and the value shown applies (the default)
#    "#key =" lines are off / at their default: remove the "#" to set them.
#  bin/services --rehash (SIGHUP) or /REHASH on the hub reloads this file;
#  [link], the bots' nick/user/host/realname and the database paths need a
#  restart. A file with a mistake is refused and the running settings stay.
#
#  Contents: [link] [chanserv] [nickserv] [[opers]] [storage]
#  Related: ../stats/stats.toml (network stats collector, optional)
# =============================================================================

# =============================================================================
#  [link] -- how services connect to the hub
# =============================================================================
[link]
# [required] The hub's link listener ([links] bind/port), not a client port.
host = "127.0.0.1"
port = 7000
# [required] Must match a [[links.peers]] entry of the hub. Keep the PLAIN
# password here (the hub may store a password_hash).
name = "services.sekurircd.local"
password = "change-me-to-a-long-shared-secret"

# --- services on another machine than the hub (all need a restart) ---
# Without TLS every IDENTIFY and SASL password crosses the network in plain
# text (both sides warn). A hub with [links] tls takes plain text only from its
# own machine.
# [optional] Link to the hub over TLS.
#tls = false
# [optional] Pin the hub's certificate by its SHA-256 ("sha256:" and colons
# allowed); checked before the password is sent. Unset = verify it like a web
# server's, against ca_file (or the system CAs) and the name in `host`.
# Get it: openssl x509 -in hub.crt -noout -fingerprint -sha256
#fingerprint = ""
#ca_file = ""
# [optional] A certificate of our own, so the hub can pin this daemon with a
# fingerprint on its [[links.peers]] entry. Both or neither; relative = next
# to this file.
#cert = ""
#key = ""
# [optional] Never send a password in plain text to a hub on another machine:
# without TLS the daemon refuses to link (127.0.0.1 is not affected).
#require_tls = false

# =============================================================================
#  [chanserv] -- channel registration
# =============================================================================
[chanserv]
# [optional] The bot's identity (restart to change).
nick = "ChanServ"
user = "ChanServ"
host = "services.sekurircd.local"
realname = "Channel Registration Service"
# [optional] Drop a channel nobody used (IDENTIFY or a password command) for
# this many days. 0 = never.
#expire_days = 0
# [optional] What the founder gets on IDENTIFY or CLAIM: "o" = op (@),
# "q" = owner (~).
#founder_mode = "o"

# =============================================================================
#  [nickserv] -- accounts, SASL, nick ownership, account vhosts
# =============================================================================
[nickserv]
# [optional] false = ChanServ only (no accounts, no SASL).
#enabled = true
# [optional] The bot's identity (restart to change); host defaults to [chanserv] host.
#nick = "NickServ"
#user = "NickServ"
#host = "services.sekurircd.local"
#realname = "Nickname and Account Service"

# --- account database ---
# [optional] Account file, relative to this file. Unset = the old ircd-side
# accounts.json if one exists, else nickserv.json here. Rotating backups
# (<file>.bak1..N) are kept; a corrupt file is never overwritten.
#store_file = "../config/accounts.json"
#backup_count = 5
# [optional] Most accounts allowed. 0 = unlimited.
#max_accounts = 0

# --- administration ---
# [recommended] Services admins: SUSPEND, FDROP, SASET PASSWORD, ACTIVATE,
# NOEXPIRE, VHOST ADD|DEL|LIST and full INFO. Makes nobody an IRC operator
# (that is [[opers]]).
#admins = ["youraccount"]

# --- nick ownership ---
# [optional] Someone on a registered nick must log in within enforce_grace
# seconds (5-600) or is renamed Guest<number>, on every server.
#enforce_nicks = false
#enforce_grace = 60
# [optional] Always-on (/msg NickServ SET ALWAYS-ON ON): the nick stays online,
# away, in its channels after a disconnect; reconnecting with SASL resumes it.
# Kept always_on_expire_days after the disconnect (0 = forever).
#always_on = true
#always_on_expire_days = 30

# --- account cloak: the host of a logged-in user ---
# [optional] A logged-in user who has not chosen a vhost shows
# account_cloak_format instead of the usual cloak, on every server; logging
# out brings the usual one back. A vhost they choose (NickServ VHOST, /VHOST)
# wins; VHOST DEFAULT goes back to this. false = logged-in users keep the
# usual host.
#account_cloak = true
# [optional] {account} = the account name, {network} = the network name
# (lowercased); characters a host can't hold become "-". Must contain {account}.
# e.g. "{account}.users.{network}" gives "alice.users.sekurnet".
#account_cloak_format = "users/{account}"

# --- registration and email ---
# [optional] REGISTER needs an email, and the account does nothing until its
# owner sends the mailed code (/msg NickServ VERIFY <code>) within
# verify_window_hours (1-168); else it is dropped. Needs email_command.
#require_email = false
#verify_window_hours = 24
# [optional] Program that mails verification / reset / expiry codes, run
# without a shell as:
#   <email_command> <address> <code> <account> <network> verify|reset|expire
# "" = no mail (no verified addresses, no RESETPASS). network defaults to the
# ircd's [server] network.
#email_command = "/usr/local/bin/send-verification"
#network = "SekurNet"

# --- account expiry ---
# [optional] Drop an account nobody logged in to for this many days (its
# channels lose it as founder/access/successor). Admins, [[opers]], suspended
# and NOEXPIRE accounts never expire. 0 = never.
#expire_days = 0
# [optional] Mail a warning this many days before (email_command purpose
# "expire", days left as <code>). 0 = no warning.
#expire_warn_days = 0

# =============================================================================
#  [[opers]] -- network-wide IRC operators (one block per account)
# =============================================================================
# Operator status on whichever server the account logs in to, with no
# [[operators]] there; it ends at logout, disconnect, or when the entry is
# removed and services reload. Up to 32.
#   account        [required] the NickServ account
#   certfp         [required unless password_only] SHA-256 of their TLS client
#                  certificate (colons fine; `NickServ CERT INFO` shows it).
#                  Their server needs [tls] request_client_cert = true.
#   password_only  [optional] true = the account login alone is enough
#   privileges     [optional] the [[operators]] names (kill, kline, sa, host,
#                  wallops, rehash, die, link, override, auspex, immune,
#                  all); default all
# A server can refuse these with [security] accept_services_opers = false; a
# hub's oper_scope / oper_deny still apply. Keep these blocks after [nickserv].
#[[opers]]
#account    = "youraccount"
#certfp     = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
#privileges = ["all"]

#[[opers]]
#account       = "helper"
#password_only = true
#privileges    = ["kill", "kline"]

# =============================================================================
#  [storage] -- ChanServ's registrations
# =============================================================================
[storage]
# [optional] Channel database, relative to the directory bin/services runs
# from (not this file).
path = "chanserv.json"
# [optional] Rotating backups (<path>.bak1 = newest); a missing or corrupt
# file falls back to the newest readable one.
backup_count = 5
