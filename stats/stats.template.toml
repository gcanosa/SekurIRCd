# =============================================================================
#  SekurIRCd network stats (stats/stats.toml, read by stats/netstats.py)
# =============================================================================
#  Only the server running services (the hub) needs it; without stats.toml
#  nothing runs and services collect nothing.
#    ./sekurircd enable-stats                         writes stats.toml from this file, collector on
#    stats/netstats.py --user --admin --add yourname  a panel login (asks for the password)
#    ./sekurircd start-stats                          the panel: http://127.0.0.1:8089/admin/
#    ./sekurircd disable-stats                        all off again (stats.toml -> stats.toml.disabled)
#  For per-server CPU, memory, version and the connections heatmap, set on
#  EVERY server's sekurircd.toml: [debug_channel] stats_interval = 300.
#
#  How to read this file:
#    [optional]  leave it out and the value shown applies (the default)
#    "#key =" lines are off / at their default: remove the "#" to set them.
#
#  Contents: [collector] [storage] [http] [[users]] [announce] [alerts]
#            [export] [geoip] [health] [[servers]]
# =============================================================================

# =============================================================================
#  [collector] -- what services record for the panel
# =============================================================================
[collector]
# [optional] Turn collection on (./sekurircd enable-stats does it).
enabled = false
# [optional] Seconds between network snapshots (splits, bans and stats lines
# are logged as they happen).
sample_seconds = 60
# [optional] Event file, relative to this file; netstats loads and empties it
# every minute.
log = "events.log"

# =============================================================================
#  [storage] -- the history database
# =============================================================================
[storage]
# [optional] SQLite file, relative to this file.
database = "stats.db"
# [optional] Days of daily history kept (7-3650). Per-minute samples are kept
# 7 days, hourly ones 90.
retention_days = 365

# =============================================================================
#  [http] -- the live web panel (./sekurircd start-stats)
# =============================================================================
[http]
# [optional] false = no live panel: use "netstats.py render" from cron and [export].
enabled = true
# [optional] Shown in the page title.
network_name = "MyNetwork"
# [optional] 127.0.0.1 behind a reverse proxy (nginx/caddy) is best; or bind
# publicly with tls_cert/tls_key and open `port` (netstats.py check prints the
# firewall commands).
bind = "127.0.0.1"
port = 8089
tls_cert = ""
tls_key = ""
# [optional] true = anyone sees the viewer page without logging in.
public = false
# [optional] The name the panel is opened by through an HTTPS reverse proxy,
# e.g. "stats.example.net" ("netstats.py check" then prints a Caddyfile block).
hostname = ""
# [optional] Proxies whose X-Forwarded-For is believed (failed logins then
# count per visitor). Default: ["127.0.0.1", "::1"] with hostname set, else none.
# trusted_proxies = ["127.0.0.1", "::1"]

# =============================================================================
#  [[users]] -- panel logins (managed with netstats.py --user)
# =============================================================================
#   name      the login name
#   password  scrypt string (netstats.py --mkpasswd)
#   role      "admin" (everything) or "viewer" (no Security/Maintenance, no IPs)
# Add/remove: netstats.py --user --admin|--viewer --add|--del NAME; list: --user --status.
# [[users]]
# name = "yourname"
# password = "scrypt$..."
# role = "admin"

# =============================================================================
#  [announce] -- planned maintenance, told to users on IRC
# =============================================================================
[announce]
# [optional] Reminders before a planned window starts (per window, "tell users
# on IRC" on the panel; needs [collector] enabled).
reminders = ["24h", "1h"]

# =============================================================================
#  [alerts] -- a webhook post when something needs a human
# =============================================================================
# A link down for down_minutes, no data from services, a port not answering, a
# certificate with under cert_days left. Sent once when it starts and once when
# it is fine again; never during planned maintenance.
[alerts]
# [optional] Webhook URL. "" = off. e.g. "https://ntfy.sh/my-irc-alerts"
webhook = ""
# [optional] "json" ({"text": ..., "content": ...}: Discord, Slack, Mattermost)
# or "text" (a plain body: ntfy).
format = "json"
down_minutes = 5
cert_days = 14

# =============================================================================
#  [export] -- static pages written by "netstats.py render" (run it from cron)
# =============================================================================
[export]
# [optional] Where to write the viewer page and the admin page ("" = not
# written). Protect admin_html with your web server.
public_html = ""
admin_html = ""

# =============================================================================
#  [geoip] -- the server map
# =============================================================================
[geoip]
# [optional] DB-IP Lite city database (CC BY 4.0), fetched by "netstats.py
# geoip-update" (monthly is plenty). Lookups stay local.
file = "dbip-city-lite.csv.gz"

# =============================================================================
#  [health] -- probes netstats makes to every server
# =============================================================================
[health]
# [optional] Ports to probe, which of them speak TLS (certificate days left),
# seconds between rounds and per-probe timeout.
ports = [6667, 6697]
tls_ports = [6697]
interval = 300
timeout = 5

# =============================================================================
#  [[servers]] -- per-server overrides (one block per server, all optional)
# =============================================================================
#   name      the server's name as in /LINKS
#   host      what to probe and geolocate (default: the name)
#   location  label;  lat / lon  map position (overrides GeoIP)
#   ports     replaces [health] ports;  hide  true = leave it off the page
# [[servers]]
# name = "irc.example.net"
# host = "203.0.113.10"
# location = "Amsterdam, NL"
# lat = 52.37
# lon = 4.90
# ports = [6667, 6697, 8097]
# hide = false
