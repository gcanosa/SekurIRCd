<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat · SekurNet</title>
<meta name="description" content="Chat on the SekurNet IRC network straight from your browser. No install, no account.">
<link rel="icon" href="img/favicon.ico" sizes="any">
<script>(function(){var t;try{t=localStorage.getItem("theme")}catch(e){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t})()</script>
<link rel="stylesheet" href="css/site.css">
</head>
<body data-root="./" data-page="chat">
<header id="site-header"></header>
<main class="wrap" style="padding-bottom:48px">
<h1>chat</h1>
<form id="connect" class="chat-form">
  <p>Join the <strong>SekurNet</strong> IRC network from your browser. Pick a nickname and a channel.</p>
  <label>Nickname <input id="nick" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
  <label>Channel <input id="chan" maxlength="50" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
  <button class="btn primary" type="submit">Connect</button>
  <p id="conn-err" class="err" role="alert"></p>
  <p class="hint">Prefer a desktop client? Connect to <code>ircsekurnet.duckdns.org</code> port 6667 (plain) or 6697 (TLS).</p>
</form>
<section id="chat" class="chat" hidden>
  <div id="tabs" class="chat-tabs" role="tablist"></div>
  <div id="topic" class="chat-topic"></div>
  <div class="chat-body">
    <div id="log" class="chat-log" aria-live="polite"></div>
    <aside class="chat-users" aria-label="Users"><div id="users"></div></aside>
  </div>
  <form id="send" class="chat-send">
    <input id="input" maxlength="400" autocomplete="off" autocapitalize="off" placeholder="Message, or /join #chan, /close, /nick name, /me action, /msg nick text, /quit" aria-label="Message">
    <button class="btn" type="submit">Send</button>
  </form>
</section>
</main>
<footer id="site-footer"></footer>
<script src="js/site.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
